[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-cli"
version = "1.0.0"
description = "A simple command-line to-do list manager"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
todo = "todo.cli:main"

[tool.setuptools]
packages = ["todo"]